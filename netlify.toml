[build]
  command = "bash scripts/stamp-version.sh"
  functions = "netlify/functions"

# ============================================================================
# THE REPO IS THE PUBLISH DIRECTORY, AND EVERYTHING IN IT WAS PUBLIC.
#
# Found live, 30 Aug, while about to commit a test fixture: there is no
# `publish` key, so Netlify deploys the repository root. Every one of these
# answered 200 with its real bytes to anyone who asked:
#
#   /scripts/tests/ttotals.cjs      real logged days for two named clients
#   /scripts/tests/tshareday.cjs    a third client's real Wednesday, by name
#   /netlify/functions/trainer.js   157KB — the whole trainer door, all its ops
#   /netlify/functions/session.js   the session and token logic
#   /CLAUDE.md                      the landmine register
#   /BACKLOG.md                     item 0, which describes the authentication
#                                   gap and the open tables in plain English
#   /migrations/*.sql  /sql/*.sql   the schema and the lockdown history
#
# No key leaked — those live in the function environment, not in source. What
# leaked is real clients' names beside their meals, and a written description of
# where the app is soft. Dotfiles were already hidden by Netlify (/.claude/*
# and /.serve.cjs both 404), which is the only reason this was not worse.
#
# A BLACKLIST IS THE WRONG SHAPE AND IT IS WHAT THIS IS. The right fix is a
# publish directory that only ever contains what the site serves, so a folder
# added next month is private by default instead of public by default. That
# changes the build, so it is written up rather than done here at speed —
# see the note at the foot of this file. This stops the bleeding today.
#
# WHAT MUST KEEP WORKING, and is deliberately not matched below:
#   /                    the app
#   /VERSION             checkForUpdate() fetches it; block it and no client
#                        ever auto-updates again
#   /join/*  /welcome/*  real pages
#   /.netlify/functions/*  served by the functions runtime, not from here
# ============================================================================

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/migrations/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/sql/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/BACKLOG.md"
  to = "/404.html"
  status = 404
  force = true

# Belt and braces on the two file types that only ever exist here as source.
# A future folder is still public — which is the blacklist's weakness, and the
# reason the note below is not optional.
[[redirects]]
  from = "/*.sql"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.cjs"
  to = "/404.html"
  status = 404
  force = true

# ============================================================================
# THE REAL FIX, WHEN THERE IS TIME TO VERIFY IT PROPERLY
#
#   1. Add `publish = "public"` to [build].
#   2. Have scripts/stamp-version.sh finish by assembling that directory:
#        mkdir -p public && cp index.html VERSION 404.html public/
#        cp -R join welcome public/
#      stamping index.html INSIDE public/, so the placeholder survives in git.
#   3. Delete every redirect above — they become unnecessary, and a whitelist
#      cannot rot the way this list can.
#   4. Verify after deploy, by curl and not by reading: /, /VERSION, /join/,
#      /welcome/ all 200, and /scripts/tests/ttotals.cjs 404.
#
# Until then, ANY new top-level folder is served to the public. If you add one,
# add it above in the same commit.
# ============================================================================
