<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>YOURJIMBFF</title>
<style>
  :root{ --bg:#0e0e0e; --text:#f0ece4; --gold:#f5c518; --muted:rgba(240,236,228,0.55); }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:var(--bg);color:var(--text);
       font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
       text-align:center;padding:24px;}
  .w{max-width:340px;}
  .b{font-size:22px;font-weight:800;letter-spacing:2px;color:var(--gold);}
  .m{font-size:14px;line-height:1.6;color:var(--muted);margin-top:14px;}
  a{display:inline-block;margin-top:22px;padding:12px 26px;border-radius:11px;
    background:var(--gold);color:#000;font-size:13px;font-weight:800;text-decoration:none;}
</style>
</head>
<body>
  <div class="w">
    <div class="b">YOURJIMBFF</div>
    <!-- Says nothing about what is or is not here. A 404 that explains itself is
         a directory listing with extra steps. -->
    <div class="m">That page isn’t here.</div>
    <a href="/">Open the app</a>
  </div>
</body>
</html>
